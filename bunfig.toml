[lint]
ignorePatterns = [".claude/", ".superpowers/", "akapen/", "storybook-static/"]

[lint.rules]
"max-lines" = [
  "error",
  { max = 300, skipBlankLines = true, skipComments = true },
]
"max-lines-per-function" = [
  "error",
  { max = 100, skipBlankLines = true, skipComments = true },
]

[fmt]
ignorePatterns = [
  ".claude/",
  ".superpowers/",
  "akapen/",
  "docs/superpowers/",
  "skills-lock.json",
]
